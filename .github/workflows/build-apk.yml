name: Build APK

# Membangun APK Android (debug-signed, langsung bisa dipasang) pada:
# - push ke main / master
# - tag v* (otomatis membuat GitHub Release berisi APK)
# - manual: Actions -> Build APK -> Run workflow
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      admin:
        description: "Ikut bangun versi ADMIN (uji karakter penuh)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Cari folder proyek Godot (boleh di akar repo atau di subfolder)
        run: |
          PGD="$(find . -name project.godot -not -path './.git/*' -not -path './fantasy_life_rpg_admin/*' | awk '{print length, $0}' | sort -n | head -n1 | cut -d' ' -f2-)"
          if [ -z "$PGD" ]; then echo "project.godot tidak ditemukan di repo"; ls -la; exit 1; fi
          P="$(dirname "$PGD")"
          echo "Proyek ada di: $P"
          if [ "$P" != "." ]; then cp -a "$P"/. . ; fi
          ls export_presets.cfg project.godot
          mkdir -p build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang platform & build-tools Android (pakai SDK bawaan runner)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}.0
          use-dotnet: false
          include-templates: true

      - name: Keystore debug + pengaturan editor Godot
        run: |
          mkdir -p "$HOME/.config/godot" build
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          F="$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$SDK\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
            echo 'export/android/force_system_user = false'
            echo 'export/android/shutdown_adb_on_exit = true'
          } > "$F"
          cp "$F" "$HOME/.config/godot/editor_settings-4.tres"
          cat "$F"

      - name: Nomor versi dari nomor run
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" export_presets.cfg

      - name: Impor aset
        run: godot --headless --path . --import || true

      - name: Uji cepat (data, unit, save, perf)
        continue-on-error: true   # peringatan saja, tidak menghalangi build APK
        run: |
          fail=0
          for t in test_data unit_test save_test perf_test; do
            godot --headless --path . res://tools/$t.tscn | tee /tmp/$t.log
            if grep -qE "CHECK FAIL|SCRIPT ERROR" /tmp/$t.log; then fail=1; fi
          done
          exit $fail

      - name: Ekspor APK (game)
        run: godot --headless --path . --export-debug "Android" build/fantasy_life_rpg.apk

      # APK RILIS opsional — hanya jalan bila Secrets repo diisi:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD
      - name: Ekspor APK RILIS (opsional)
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$HOME/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/release.keystore"
          godot --headless --path . --export-release "Android" build/fantasy_life_rpg_release.apk
          rm -f "$HOME/release.keystore"

      - name: Bangun & ekspor versi ADMIN
        continue-on-error: true   # kegagalan admin tidak boleh menggagalkan APK utama
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.admin || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 tools/make_admin.py
          cd ../fantasy_life_rpg_admin 2>/dev/null || cd "$(dirname "$GITHUB_WORKSPACE")/fantasy_life_rpg_admin"
          godot --headless --path . --import || true
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/fantasy_life_rpg_admin.apk
          cp build/fantasy_life_rpg_admin.apk "$GITHUB_WORKSPACE/build/"

      - uses: actions/upload-artifact@v4
        with:
          name: fantasy-life-rpg-apk
          path: build/*.apk
          if-no-files-found: error

      - name: Perbarui rilis "latest" (push ke main/master)
        if: github.ref_type == 'branch'
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Rilis "latest" (APK terbaru, mudah diunduh dari HP)
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Build terbaru"
          prerelease: true
          files: build/*.apk
          body: "APK otomatis dari commit ${{ github.sha }} (run #${{ github.run_number }}). Unduh file .apk lalu pasang di HP."

      - name: Rilis (hanya tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.apk
          generate_release_notes: true
