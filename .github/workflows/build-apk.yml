name: Build APK

# Membangun APK Android pada (mode RILIS, ditandatangani keystore debug otomatis bila rahasia rilis tidak diisi; langsung bisa dipasang):
# - push ke main / master
# - tag v* (otomatis membuat GitHub Release berisi APK)
# - manual: Actions -> Build APK -> Run workflow
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      admin:
        description: "Ikut bangun versi ADMIN (uji karakter penuh)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      HAS_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Pasang platform & build-tools Android
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}.0
          use-dotnet: false
          include-templates: true

      - name: Keystore debug + pengaturan editor Godot
        run: |
          mkdir -p "$HOME/.config/godot" build
          # Kunci TETAP dari repo (signing/fantasylife_debug.jks): semua build bertanda tangan sama, jadi APK baru bisa DITIMPA di atas
          # yang lama TANPA uninstall (data permainan tetap). Kunci baru tiap build = HP menolak update & ID perangkat berubah.
          cp signing/fantasylife_debug.jks "$HOME/debug.keystore"
          keytool -list -v -keystore "$HOME/debug.keystore" -storepass android | grep -E "SHA1|SHA256" | sed 's/^/Sidik jari kunci: /'
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" <<EOT [gd_resource type="EditorSettings" format=3] [resource] export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" export/android/java_sdk_path = "${JAVA_HOME}" export/android/debug_keystore = "$HOME/debug.keystore" export/android/debug_keystore_user = "androiddebugkey" export/android/debug_keystore_pass = "android" export/android/force_system_user = false export/android/shutdown_adb_on_exit = true EOT
          cp "$HOME/.config/godot/editor_settings-${GODOT_VERSION}.tres" "$HOME/.config/godot/editor_settings-4.tres"

      - name: Nomor versi dari nomor run
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" export_presets.cfg

      - name: Impor aset
        run: |
          # Gagal impor = gagal build (dulu `|| true` menelan error; aset yang tak terimpor menyebabkan atlas null saat game jalan)
          # Kode keluar Godot sengaja TIDAK dipakai (kadang non-nol saat menutup, padahal impor sukses); yang menentukan adalah log & hasil impor.
          set +e
          godot --headless --path . --import > /tmp/import.log 2>&1
          set -e
          cat /tmp/import.log
          if grep -qiE "failed to import|error importing|cannot open file|failed loading resource" /tmp/import.log; then
            echo "::error::Impor aset gagal, lihat log di atas."; exit 1
          fi
          test -d .godot/imported && [ "$(ls .godot/imported | wc -l)" -gt 50 ] || { echo "::error::Folder .godot/imported kosong/kecil: impor tidak jalan."; exit 1; }

      # Hitung animasi anti-tembus/gaya/ulti/fidget SEKALI di sini supaya HP tidak menghitungnya (penyebab patah-patah saat karakter muncul).
      - name: Bake animasi (resources/anim_baked.res)
        continue-on-error: true
        run: godot --headless --path . res://tools/bake_anims.tscn

      - name: Uji cepat (data, unit, save, perf) - WAJIB lulus
        run: |
          fail=0
          for t in test_data unit_test save_test perf_test; do
            godot --headless --path . res://tools/$t.tscn | tee /tmp/$t.log
            if grep -qE "CHECK FAIL|SCRIPT ERROR" /tmp/$t.log; then fail=1; fi
          done
          exit $fail

      # PENTING: APK harus diekspor sebagai RILIS. Template "debug" Godot jauh lebih lambat (GDScript berjalan dengan pemeriksaan
      # debugger/profiler tambahan) sehingga terasa berat & patah-patah di HP. Bila ekspor rilis gagal, jatuh ke debug agar build tetap jadi.
      - name: Ekspor APK (game, RILIS)
        if: ${{ env.HAS_RELEASE_KEY != 'true' }}
        run: |
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
          godot --headless --path . --export-release "Android" build/fantasy_life_rpg.apk \
            || { echo "::error::Ekspor RILIS GAGAL. Tidak ada APK debug yang dibuat (lambat, audio bisa putus). Kirim log ini untuk diperbaiki."; exit 1; }

      # APK RILIS opsional — hanya jalan bila Secrets repo diisi:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD
      - name: Ekspor APK RILIS (opsional)
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$HOME/release.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/release.keystore"
          godot --headless --path . --export-release "Android" build/fantasy_life_rpg.apk
          rm -f "$HOME/release.keystore"

      - name: Bangun & ekspor versi ADMIN
        continue-on-error: true   # kegagalan admin tidak boleh menggagalkan APK utama
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.admin || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          python3 tools/make_admin.py
          cd ../fantasy_life_rpg_admin 2>/dev/null || cd "$(dirname "$GITHUB_WORKSPACE")/fantasy_life_rpg_admin"
          godot --headless --path . --import || true
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
          godot --headless --path . --export-release "Android" build/fantasy_life_rpg_admin.apk \
            || godot --headless --path . --export-debug "Android" build/fantasy_life_rpg_admin.apk
          cp build/fantasy_life_rpg_admin.apk "$GITHUB_WORKSPACE/build/"

      - uses: actions/upload-artifact@v4
        with:
          name: fantasy-life-rpg-apk
          path: build/*.apk
          if-no-files-found: error

      - name: Perbarui rilis "latest" (push ke main/master)
        if: github.ref_type == 'branch'
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Rilis "latest" (APK terbaru, mudah diunduh dari HP)
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Build terbaru"
          prerelease: true
          files: build/*.apk
          body: "APK otomatis dari commit ${{ github.sha }} (run #${{ github.run_number }}). Unduh file .apk lalu pasang di HP."

      - name: Rilis (hanya tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.apk
          generate_release_notes: true
